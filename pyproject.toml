[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alt_celery3"
version = "0.1.0"
description = "基于 Docker 部署的生产级 Celery 任务平台"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "alt_celery3" }]
dependencies = [
    "celery[redis]>=5.4,<6",
    "flower>=2.0",
    # 自定义包（未发布 PyPI，从 GitHub 按 tag 安装）
    "sclog_lite @ git+https://github.com/ashida2016/sclog_lite.git@ver0.3.1",
    "alt_generate_zh_name @ git+https://github.com/ashida2016/alt_generate_zh_name.git@ver0.3.1",
    "scdb_mysql_speed @ git+https://github.com/ashida2016/scdb_mysql_speed.git@ver0.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
packages = ["app", "app.tasks"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
